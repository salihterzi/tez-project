# Geliştirme ortamı. `docker compose` bu dosyayı otomatik yükler.
services:
  php:
    build:
      target: php_dev
    volumes:
      - ./:/app
      - ./docker/php/conf.d/app.dev.ini:/usr/local/etc/php/conf.d/20-app.dev.ini:ro
    environment:
      XDEBUG_MODE: "${XDEBUG_MODE:-off}"
    extra_hosts:
      - host.docker.internal:host-gateway

  nginx:
    ports: !override
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./public:/app/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  database:
    ports:
      - "${MYSQL_PORT:-3307}:3306"

  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    environment:
      PMA_HOST: database
      PMA_USER: ${MYSQL_USER:-app}
      PMA_PASSWORD: ${MYSQL_PASSWORD:-ChangeMe}
      UPLOAD_LIMIT: 64M
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    depends_on:
      database:
        condition: service_healthy
