# Geliştirme ortamı. `docker compose` bu dosyayı otomatik yükler.
services:
  php:
    build:
      target: php_dev
    volumes:
      - ./:/app
      - ./docker/php/conf.d/app.dev.ini:/usr/local/etc/php/conf.d/20-app.dev.ini:ro
    environment:
      XDEBUG_MODE: "${XDEBUG_MODE:-off}"
    extra_hosts:
      - host.docker.internal:host-gateway

  nginx:
    ports: !override
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./public:/app/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  database:
    ports:
      - "${MYSQL_PORT:-3307}:3306"
