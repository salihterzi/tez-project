# Prod katmanı. HER ZAMAN açıkça yüklenmeli:
#
#   docker compose --env-file deploy/prod.env -f compose.yaml -f compose.prod.yaml up -d
#
# `-f compose.yaml` YAZILMAZSA Docker compose.override.yaml'ı otomatik yükler ve
# phpMyAdmin'i (:8081) ile MySQL'i (:3307) internete açar. Makefile'daki
# `prod-*` hedefleri bu bayrakları zaten doğru geçiriyor.
services:
  php:
    # Ayrı etiket ZORUNLU (2026-11-24'te bir kesintiye yol açtı): compose.yaml
    # `tez-proje-php` adını hem php_dev hem php_prod için kullanıyor. Etiketi hangi
    # hedef en son derlediyse o kapıyor; `up` --build olmadan çağrıldığında sessizce
    # yanlış imajı çalıştırıyor. Dev imajı prod'a düşerse xdebug'lı, APP_ENV=dev bir
    # konteyner elde edilir.
    image: ${IMAGES_PREFIX:-}tez-proje-php:prod
    build:
      target: php_prod
    environment:
      # compose.yaml'da `APP_ENV: ${APP_ENV:-dev}` yazıyor ve interpolasyon
      # kaynağı deploy/prod.env. Yine de burada SABİT yazılıyor: APP_ENV dev
      # kalırsa imaja gömülü .env.local.php devre dışı kalır (Symfony dumped
      # env'i yalnızca APP_ENV eşleşirse kullanır) ve uygulama commit'li
      # .env'deki postgresql DATABASE_URL'sine düşer.
      APP_ENV: prod
      APP_DEBUG: "0"
    # Gizli anahtarlar imaja GİRMEZ (.dockerignore) ve prod'da bind mount yok —
    # çalışma zamanında env_file ile enjekte edilir. php-fpm'de clear_env=no
    # olduğu için PHP'ye ulaşırlar (docker/php/php-fpm.d/zz-app.conf).
    env_file:
      - deploy/app-secrets.env
    volumes:
      # Prod'da monolog stderr'a yazıyor, ama cron logları (tetikleyici-cron.log,
      # zamanlanmis-mesaj-dispatch.log) dosyaya gidiyor ve konteyner yenilenince
      # kaybolur.
      - php_logs:/app/var/log

  python:
    volumes:
      - python_logs:/app/var/log

  nginx:
    # Ayrı etiket: nginx_base'de /app/public YOK (dev'de bind mount'la geliyor),
    # nginx_prod'da imaja kopyalanıyor. Etiket paylaşıldığı için dev derlemesi
    # prod'un imajını ezmiş ve nginx `realpath() "/app/public" failed` ile her
    # isteği reddetmişti.
    image: ${IMAGES_PREFIX:-}tez-proje-nginx:prod
    build:
      target: nginx_prod
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      # ACME webroot'u TLS katmanı YÜKLENMEDEN de bağlı olmalı: sertifika ilk kez
      # alınırken nginx hâlâ 80'de düz HTTP modunda çalışıyor ve doğrulama dosyasını
      # bu dizinden sunuyor (bkz. docker/nginx/default.conf).
      - certbot_www:/var/www/certbot:ro

  database:
    # IDE'den (PhpStorm Database, DBeaver) tablolara erişim için — 2026-11-25.
    #
    # `127.0.0.1:` ÖNEKİ ZORUNLU. Önek olmadan (`"3306:3306"`) Docker portu
    # 0.0.0.0'a bağlar ve bunu yaparken kuralı iptables'ın DOCKER zincirine
    # yazar: UFW'de 3306 kapalı görünse bile MySQL internetten erişilebilir
    # olur. 53 bin öğrencinin kişisel verisi için kabul edilemez (KVKK).
    #
    # Loopback'e bağlı olduğu için yalnızca SSH tüneliyle ulaşılır:
    #   ssh -N -L 3308:127.0.0.1:3306 kullanici@sunucu
    # Yerel 3308 seçiliyor çünkü 3307'de dev MySQL duruyor
    # (compose.override.yaml) ve tünel onu ezerdi.
    #
    # HOST_DB_PORT ile değiştirilebilir; 127.0.0.1 kısmı sabit bırakıldı ki
    # yanlış bir env değeri servisi kazara internete açamasın.
    ports:
      - "127.0.0.1:${HOST_DB_PORT:-3306}:3306"

volumes:
  php_logs:
  python_logs:
  certbot_www:
