# TLS katmanı — Meta webhook'u HTTPS ZORUNLU tutuyor, yani gerçek pilotta şart.
# compose.prod.yaml'ın ÜSTÜNE yüklenir:
#
#   docker compose --env-file deploy/prod.env \
#     -f compose.yaml -f compose.prod.yaml -f compose.tls.yaml up -d
#
# Yumurta-tavuk: nginx, sertifika dosyası yoksa 443 bloğuyla AÇILMAZ. Bu yüzden
# ilk sertifika alınırken bu dosya YÜKLENMEZ (bkz. prod-tasima-plani.md § 1).
services:
  nginx:
    ports: !override
      - "80:80"
      - "443:443"
    volumes:
      # Baked /etc/nginx/conf.d/default.conf'u TLS'li sürümle değiştirir.
      # ALAN_ADI yer tutucusu sed ile gerçek alan adına çevrilmiş olmalı.
      - ./docker/nginx/prod-tls.conf:/etc/nginx/conf.d/default.conf:ro
      # certbot_www'yi compose.prod.yaml zaten bağlıyor; burada yinelenmez.
      - certbot_conf:/etc/letsencrypt:ro

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Istanbul}
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    # 12 saatte bir yenileme denemesi; süresi yaklaşmayan sertifikada hiçbir şey yapmaz.
    entrypoint: >
      sh -c "trap exit TERM;
             while :; do certbot renew --webroot -w /var/www/certbot --quiet;
             sleep 12h & wait $${!}; done"

volumes:
  certbot_conf:
