# TLS katmanı — Meta webhook'u HTTPS ZORUNLU tutuyor, yani gerçek pilotta şart.
# compose.prod.yaml'ın ÜSTÜNE yüklenir:
#
#   docker compose --env-file deploy/prod.env \
#     -f compose.yaml -f compose.prod.yaml -f compose.tls.yaml up -d
#
# Yumurta-tavuk: nginx, sertifika dosyası yoksa 443 bloğuyla AÇILMAZ. Bu yüzden
# ilk sertifika alınırken bu dosya YÜKLENMEZ (bkz. prod-tasima-plani.md § 1).
services:
  nginx:
    # `!override` KULLANILMIYOR: o etiket Compose v2.24.0'da geldi ve daha eski
    # sürümlerde SESSİZCE yok sayılıp listeler birleştiriliyor (yerelde v2.20.2
    # ile doğrulandı). Base compose.yaml zaten `${HTTP_PORT:-80}:80` yayınlıyor,
    # burada yalnızca 443 ekleniyor — hem eski hem yeni sürümde aynı sonuç.
    ports:
      - "443:443"
    volumes:
      # Baked /etc/nginx/conf.d/default.conf'u TLS'li sürümle değiştirir.
      # ALAN_ADI yer tutucusu sed ile gerçek alan adına çevrilmiş olmalı.
      - ./docker/nginx/prod-tls.conf:/etc/nginx/conf.d/default.conf:ro
      # certbot_www'yi compose.prod.yaml zaten bağlıyor; burada yinelenmez.
      - certbot_conf:/etc/letsencrypt:ro

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Istanbul}
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    # 12 saatte bir yenileme denemesi; süresi yaklaşmayan sertifikada hiçbir şey yapmaz.
    #
    # DİKKAT (2026-11-24'te acı şekilde öğrenildi): bu `entrypoint` yüzünden
    # `docker compose run --rm certbot certonly ...` BEKLENDİĞİ GİBİ ÇALIŞMAZ.
    # `run` argümanları *command* olarak geçiriyor, ama entrypoint `sh -c "<script>"`
    # biçiminde; `sh -c` fazladan argümanları $0/$1 yapıp YOK SAYAR. Sonuç: certonly
    # hiç çalışmaz, konteyner sessizce yenileme döngüsüne girip 12 saat uyur ve
    # ekrana hiçbir şey yazmaz. Tek seferlik certbot çağrılarında entrypoint'i geri
    # almak ZORUNLU:
    #   docker compose ... run --rm --entrypoint certbot certbot certonly --webroot ...
    entrypoint: >
      sh -c "trap exit TERM;
             while :; do certbot renew --webroot -w /var/www/certbot --quiet;
             sleep 12h & wait $${!}; done"

volumes:
  certbot_conf:
