server {
    listen 80;
    server_name _;
    root /app/public;

    client_max_body_size 20m;

    # Let's Encrypt ACME doğrulaması. Prod'da certbot_www volume'ü buraya bağlanır
    # (compose.prod.yaml) ve `certbot certonly --webroot` bu yoldan doğrulanır; TLS
    # katmanı yüklenmeden sertifika alınabilmesi buna bağlı. Dev'de dizin yok, 404 döner.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    # index.php dışındaki tüm PHP dosyalarını çalıştırmayı reddet
    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 300;
        # Prod'da mimari değişikliği: internal; satırını açıp
        # PATH_INFO içeren istekleri sadece index.php'ye yönlendir
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}
