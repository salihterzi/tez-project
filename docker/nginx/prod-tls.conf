# Prod + TLS. compose.tls.yaml tarafından /etc/nginx/conf.d/default.conf olarak
# bağlanır ve imaja gömülü default.conf'un yerini alır.
#
# ALAN ADI: kym.anadolu.edu.tr (2026-11-23 kararı, bkz. KARARLAR.md). Dört yerde
# geçiyor — iki server_name ve iki sertifika yolu. Değişirse dördü birlikte
# güncellenmeli, yoksa nginx sertifikayı bulamaz ve 443 ile hiç açılmaz.

# 80: yalnızca ACME doğrulaması + HTTPS'e kalıcı yönlendirme
server {
    listen 80;
    server_name kym.anadolu.edu.tr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 443: uygulama
server {
    listen 443 ssl;
    http2 on;
    server_name kym.anadolu.edu.tr;

    ssl_certificate     /etc/letsencrypt/live/kym.anadolu.edu.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kym.anadolu.edu.tr/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /app/public;
    client_max_body_size 20m;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    # index.php dışındaki tüm PHP dosyalarını çalıştırmayı reddet
    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # Meta webhook'u TLS'i burada sonlandırdığımız için HTTPS'i bildirmeli
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 300;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}
