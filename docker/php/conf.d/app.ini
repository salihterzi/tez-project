expose_php = 0
; 2026-10-27: UTC'den Europe/Istanbul'a alındı. Mesaj gönderim saatleri naif TIME/DATETIME
; olarak saklanıyor ve dispatcher `target_at <= NOW()` karşılaştırmasını yapıyor; UTC'de
; öğrencinin "Akşam" tercihi (19:00) Türkiye saatiyle 22:00'de gidiyordu.
date.timezone = Europe/Istanbul
apc.enable_cli = 1
session.use_strict_mode = 1
zend.detect_unicode = 0

; https://symfony.com/doc/current/performance.html
realpath_cache_size = 4096K
realpath_cache_ttl = 600
