[www]
; Diğer konteynerlerden (nginx) erişebilmek için tüm arayüzlerde dinle
listen = 9000

; compose'daki environment değişkenlerinin (DATABASE_URL vb.) PHP'ye ulaşması için
clear_env = no

; Sağlık kontrolü ucu
ping.path = /ping
ping.response = pong

; PHP hata/çıktılarını konteyner loglarına yaz
catch_workers_output = yes
decorate_workers_output = no

pm = dynamic
pm.max_children = 20
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
